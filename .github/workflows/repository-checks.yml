name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate documentation and assets
        run: python3 scripts/check_repository.py
      - name: Validate shell syntax
        run: bash -n scripts/publish-github.sh
      - name: Run offline bootstrap safety tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package the exact tracked source, without .git or local secrets
        id: source_package
        run: git archive --format=tar.gz --output="${{ runner.temp }}/review-source.tar.gz" HEAD
      # Artifact retention is intentionally last: quota/service failures must not skip bootstrap validation.
      # Official upload-artifact v4 ref checked via GitHub API on 2026-09-13.
      - name: Retain private exact tracked source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/review-source.tar.gz
          if-no-files-found: error
          retention-days: 3
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOY_ENV: local
      CONTENT_MODE: mock
      HOME_CATEGORY_CONTENT_MODE: mock
      FIXED_PAGE_CONTENT_MODE: mock
      ARTICLE_CONTENT_MODE: mock
      DEV_CMS_DRAFT_PREVIEW: '0'
      FORMELO_ENV_FILES: ignore
      CONCEPT_MODE: 'true'
      ANALYTICS_MODE: 'off'
      ASTRO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare private evidence and identify the tested source
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p review
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          Path('review/source.json').write_text(json.dumps({
              'headSha': os.environ['PR_HEAD'], 'baseSha': os.environ['PR_BASE'],
              'eventSha': os.environ['CHECKOUT_SHA'], 'runId': os.environ['RUN_ID'],
              'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkoutTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'comparisonSha': os.environ['PR_BASE'],
              'moqTableBeforeSha': 'c02116e38b17f61323090b2ba5eaa8cf43c4db31',
              'scope': 'DEV-05F five fixed-page bodies through controlled pageKey content, existing GROQ/reader/converter, shared snapshot and original templates; 9 actual-build tests and 16 five-page browser regressions. DEV-05E Home/Category and DEV-05C articles retained; ten content URLs plus 404. Real full-site Sanity and production remain unauthorized.',
              'cmsBoundary': 'This CI run uses synthetic/offline CMS fixtures, fake test tokens and injected transport only. It has no Sanity secret and performs no live Sanity cloud request. The separately authorized one-Draft local review is recorded outside CI and is not reproduced by this workflow.',
              'browserScope': 'Pinned Chromium on Linux. Default mock plus isolated synthetic Home/Category/five fixed-page and existing article inputs. Five-page before comparison uses actual PR base; generated screenshots are not human approval, real Sanity or physical-device evidence.',
              'notExecuted': ['Real Sanity cloud read/write in this CI run', 'Author/editor authentication', 'Physical devices', 'Safari', 'Firefox', 'Edge', 'Real-device/browser UI zoom', 'Real replacement garment photography quality/crops/loading', 'Email or WhatsApp delivery', 'Real full-site CMS validation and content publication/withdrawal', 'Production deployment'],
              'assetLimit': 'The same three registered garment concepts are unchanged. T-shirt/hoodie images are explicitly reused in editorial cards and articles; two dedicated covers remain pending. No factory evidence or production-approved imagery.',
              'assets': [{'id': a['id'], 'status': a['status'], 'path': a['path']} for a in json.loads(Path('assets/manifest.json').read_text())['assets'] if a['id'] in ['HERO-001', 'CAT-TS-001', 'CAT-HD-001', 'JOURNAL-QUOTE-001', 'JOURNAL-MOQ-001', 'FACTORY-001']]
          }, indent=2))
          PYCODE
      - name: Pin and verify the runtime
        id: runtime
        run: |
          set -o pipefail
          npm install --global npm@11.19.1
          { node --version; npm --version; npm run check:runtime; } 2>&1 | tee review/runtime.txt
      - name: Install the committed dependency graph
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee review/install.txt
      - name: Typecheck and verify shared design tokens
        id: types
        run: |
          set -o pipefail
          npm run check 2>&1 | tee review/typecheck.txt
      - name: Unit, schema and real production-block regression tests
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee review/unit.txt
      - name: Build and inspect ten static concept pages plus 404
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review/build.txt
      - name: Install the pinned Chromium runtime
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm exec -- playwright install --with-deps chromium 2>&1 | tee review/browser-install.txt
      - name: Check out the actual PR base for the before comparison
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .review-baseline
          persist-credentials: false
      - name: Render the actual base Home, categories and fixed-page baseline without deployment
        id: baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p review/before
          { git -C .review-baseline rev-parse HEAD; git -C .review-baseline rev-parse HEAD^{tree}; node --version; npm --version; } > review/before/source.txt
          (cd .review-baseline && npm ci && npm run build) 2>&1 | tee review/before/build.txt
          node scripts/capture-home-baseline.mjs 2>&1 | tee review/before/capture.txt
      - name: Check out the exact pre-fix PR 6 quantity-table baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c02116e38b17f61323090b2ba5eaa8cf43c4db31
          path: .review-moq-baseline
          persist-credentials: false
      - name: Capture pre-fix quantity and two-column tables on loopback
        id: moq_baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          (cd .review-moq-baseline && npm ci && npm run build) 2>&1 | tee review/moq-before-build.txt
          node scripts/capture-quantity-baseline.mjs 2>&1 | tee review/moq-before-capture.txt
      - name: Run responsive and accessibility-oriented browser regressions
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee review/browser.txt
      - name: Re-run the required aggregate verification command
        id: verify
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.unit.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee review/verify.txt
      - name: Audit the installed graph without force-fixing dependencies
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: npm audit --json --audit-level=high > review/audit.json
      - name: Collect exact-head CMS editorial review evidence
        id: evidence
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/collect-cms-review.mjs 2>&1 | tee review/cms-evidence.txt
      - name: Collect exact-head Home and Category evidence with actual-base comparison
        id: site_evidence
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: node scripts/collect-site-review.mjs
      - name: Collect five fixed-page actual-base mock and offline evidence
        id: fixed_evidence
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/capture-home-baseline.mjs --fixed-current 2>&1 | tee review/fixed-capture.txt
          node scripts/collect-fixed-review.mjs 2>&1 | tee review/fixed-evidence.txt
      - name: Record outcomes, including skipped checks and evidence collection
        if: always()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          MOQ_BASELINE: ${{ steps.moq_baseline.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          SITE_EVIDENCE: ${{ steps.site_evidence.outcome }}
          FIXED_EVIDENCE: ${{ steps.fixed_evidence.outcome }}
        run: |
          mkdir -p review
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          keys = ['RUNTIME', 'INSTALL', 'TYPES', 'UNIT', 'BUILD', 'CHROMIUM', 'BROWSER', 'VERIFY', 'AUDIT', 'BASELINE', 'MOQ_BASELINE', 'EVIDENCE', 'SITE_EVIDENCE', 'FIXED_EVIDENCE']
          Path('review/outcomes.json').write_text(json.dumps({key.lower(): os.environ.get(key) or 'not_executed' for key in keys}, indent=2))
          PYCODE
      - name: Retain the focused private 1440-390 editorial screenshot pack
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-editorial-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/cms-editorial/
            review/source.json
            review/outcomes.json
          if-no-files-found: error
          retention-days: 5
      - name: Retain private Home and Category base-mock-offline screenshots
        if: ${{ !cancelled() && steps.site_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-home-category-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/site-integration/
            review/source.json
            review/outcomes.json
          if-no-files-found: error
          retention-days: 5
      - name: Retain private fixed-page base mock offline screenshots
        if: ${{ !cancelled() && steps.fixed_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-fixed-page-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/fixed-integration/
            review/source.json
            review/outcomes.json
          if-no-files-found: error
          retention-days: 5
      - name: Retain compact private diagnostics and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-ci-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/source.json
            review/outcomes.json
            review/runtime.txt
            review/install.txt
            review/typecheck.txt
            review/unit.txt
            review/build.txt
            review/browser-install.txt
            review/browser.txt
            review/verify.txt
            review/audit.json
            review/cms-evidence.txt
            review/before/source.txt
            review/before/build.txt
            review/before/capture.txt
            review/moq-before-build.txt
            review/moq-before-capture.txt
            review/cms-editorial/evidence.json
            review/site-integration/evidence.json
            review/fixed-integration/evidence.json
            review/fixed-capture.txt
            review/fixed-evidence.txt
            test-results/results.json
            test-results/**/trace.zip
            test-results/**/error-context.md
            assets/manifest.json
            config/routes.json
          if-no-files-found: error
          retention-days: 5
