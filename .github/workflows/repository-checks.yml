name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package the exact tracked source, without .git or local secrets
        run: git archive --format=tar.gz --output="${{ runner.temp }}/review-source.tar.gz" HEAD
      # Official upload-artifact v4 ref checked via GitHub API on 2026-09-13.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/review-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Validate documentation and assets
        run: python3 scripts/check_repository.py
      - name: Validate shell syntax
        run: bash -n scripts/publish-github.sh
      - name: Run offline bootstrap safety tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOY_ENV: local
      CONTENT_MODE: mock
      CONCEPT_MODE: 'true'
      ANALYTICS_MODE: 'off'
      ASTRO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare private evidence and identify the tested source
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p review
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          Path('review/source.json').write_text(json.dumps({
              'headSha': os.environ['PR_HEAD'], 'baseSha': os.environ['PR_BASE'],
              'eventSha': os.environ['CHECKOUT_SHA'], 'runId': os.environ['RUN_ID'],
              'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkoutTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'comparisonSha': '3600f9558465f247dceaa8234971dd9ca0c8a204',
              'moqTableBeforeSha': 'c02116e38b17f61323090b2ba5eaa8cf43c4db31',
              'scope': 'DEV-05B offline build/dev isolation, strict draft/published contracts, default-mock rendering and browser regressions. Default ten mock content URLs plus 404 remain unchanged; full-site Sanity and production remain blocked.',
              'cmsBoundary': 'This CI run uses synthetic/offline CMS fixtures, fake test tokens and injected transport only. It has no Sanity secret and performs no live Sanity cloud request. The separately authorized one-Draft local review is recorded outside CI and is not reproduced by this workflow.',
              'browserScope': 'Pinned Playwright Chromium on Linux; default mock Astro dev and static preview. CMS-live screenshots are not CI screenshots.',
              'notExecuted': ['Real Sanity cloud read/write in this CI run', 'Author/editor authentication', 'Physical devices', 'Safari', 'Firefox', 'Edge', 'Real-device/browser UI zoom', 'Real replacement garment photography quality/crops/loading', 'Email or WhatsApp delivery', 'Full-site CMS integration', 'Production deployment'],
              'assetLimit': 'The same three registered garment concepts are unchanged. T-shirt/hoodie images are explicitly reused in editorial cards and articles; two dedicated covers remain pending. No factory evidence or production-approved imagery.',
              'assets': [{'id': a['id'], 'status': a['status'], 'path': a['path']} for a in json.loads(Path('assets/manifest.json').read_text())['assets'] if a['id'] in ['HERO-001', 'CAT-TS-001', 'CAT-HD-001', 'JOURNAL-QUOTE-001', 'JOURNAL-MOQ-001', 'FACTORY-001']]
          }, indent=2))
          PYCODE
      - name: Pin and verify the runtime
        id: runtime
        run: |
          set -o pipefail
          npm install --global npm@11.19.1
          { node --version; npm --version; npm run check:runtime; } 2>&1 | tee review/runtime.txt
      - name: Install the committed dependency graph
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee review/install.txt
      - name: Typecheck and verify shared design tokens
        id: types
        run: |
          set -o pipefail
          npm run check 2>&1 | tee review/typecheck.txt
      - name: Unit, schema and real production-block regression tests
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee review/unit.txt
      - name: Build and inspect ten static concept pages plus 404
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review/build.txt
      - name: Install the pinned Chromium runtime
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -o pipefail
          npm exec -- playwright install --with-deps chromium 2>&1 | tee review/browser-install.txt
      - name: Check out the accepted PR 5 head for the before comparison
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3600f9558465f247dceaa8234971dd9ca0c8a204
          path: .review-baseline
          persist-credentials: false
      - name: Render all six accepted PR 5 pages without deploying them
        id: baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p review/before
          { git -C .review-baseline rev-parse HEAD; git -C .review-baseline rev-parse HEAD^{tree}; node --version; npm --version; } > review/before/source.txt
          (cd .review-baseline && npm ci && npm run build) 2>&1 | tee review/before/build.txt
          node scripts/capture-home-baseline.mjs 2>&1 | tee review/before/capture.txt
      - name: Check out the exact pre-fix PR 6 quantity-table baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c02116e38b17f61323090b2ba5eaa8cf43c4db31
          path: .review-moq-baseline
          persist-credentials: false
      - name: Capture pre-fix quantity and two-column tables on loopback
        id: moq_baseline
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          (cd .review-moq-baseline && npm ci && npm run build) 2>&1 | tee review/moq-before-build.txt
          node scripts/capture-quantity-baseline.mjs 2>&1 | tee review/moq-before-capture.txt
      - name: Run responsive and accessibility-oriented browser regressions
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee review/browser.txt
      - name: Re-run the required aggregate verification command
        id: verify
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.unit.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee review/verify.txt
      - name: Audit the installed graph without force-fixing dependencies
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: npm audit --json --audit-level=high > review/audit.json
      - name: Collect exact-head CMS editorial review evidence
        id: evidence
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/collect-cms-review.mjs 2>&1 | tee review/cms-evidence.txt
      - name: Record outcomes, including skipped checks and evidence collection
        if: always()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          MOQ_BASELINE: ${{ steps.moq_baseline.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
        run: |
          mkdir -p review
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          keys = ['RUNTIME', 'INSTALL', 'TYPES', 'UNIT', 'BUILD', 'CHROMIUM', 'BROWSER', 'VERIFY', 'AUDIT', 'BASELINE', 'MOQ_BASELINE', 'EVIDENCE']
          Path('review/outcomes.json').write_text(json.dumps({key.lower(): os.environ.get(key) or 'not_executed' for key in keys}, indent=2))
          PYCODE
      - name: Retain the focused private 1440-390 editorial screenshot pack
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-editorial-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/cms-editorial/
            review/source.json
            review/outcomes.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain private screenshots, reports, traces and static output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-editorial-integration-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            review/
            playwright-report/
            test-results/
            web/dist/
            assets/manifest.json
            assets/reference/homepage-selected-v1.webp
            docs/design/homepage-handoff.md
            docs/design/homepage-asset-handoff.md
            docs/operations/pr-3-homepage-review.md
            docs/design/category-handoff.md
            docs/operations/pr-4-category-review.md
            docs/design/core-information-handoff.md
            docs/operations/core-information-verification.md
            docs/design/journal-article-legal-handoff.md
            docs/operations/journal-privacy-verification.md
            docs/operations/cms-editorial-verification.md
            docs/operations/pr-7-ci-repair.md
            docs/development/cms-editorial-mapping.md
            config/editorial-sources.json
            docs/content/factory-materials-checklist.md
            config/routes.json
          if-no-files-found: error
          retention-days: 14
